    <body>
        <header>

                <img src="./media/IMG_20260416_191947.jpg" width="80%">

                    Taichi Yanase<br>

                <div id="extra-features" style="display: flex; align-items: flex-start; justify-content: center; gap: 20px; margin-top: 20px;">
    <!-- 天気エリア -->
                    <div id="weather-area">
                        <p id="weather-icon"></p>
                    </div><div id="weather-area">
                    <p id="weather-icon"></p>
                    </div>
                    <!-- キツネガチャエリア -->
                    <div id="fox-area" style="text-align: center;">
                        <button id="fox-btn" style="padding: 8px 15px; font-size: 14px; cursor: pointer;">キツネ切り替え 🦊</button>
                        <br>
    <!-- object-fit: contain に変更し、背景をつけて画像全体が収まるようにする -->
                        <img id="fox-image" src="" alt="キツネの画像" style="display: none; width: 200px; height: 200px; object-fit: contain; background-color: #000; border-radius: 8px; margin-top: 8px;">

                スキル：HTML/CSS
            </p>

            <div class="works-controls">
                <select id="category">
                    <option value="all">すべてのカテゴリ</option>
                </select>
                <select id="sort">
                    <option value="new">新しい順</option>
                    <option value="old">古い順</option>
                    <option value="title">タイトル順</option>
                </select>
